<!doctype html>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Join Moti Kitchen</title>
<style>
*{box-sizing:border-box}html,body{min-height:100%;margin:0}body{font-family:Arial,sans-serif;min-height:100vh;padding:28px 16px;background:linear-gradient(rgba(0,0,0,.28),rgba(0,0,0,.38)),url('/static/moti-background.png') center/cover fixed;display:flex;align-items:center;justify-content:center}.card{width:min(430px,100%);background:rgba(255,255,255,.94);padding:26px;border-radius:22px;box-shadow:0 18px 50px rgba(0,0,0,.28);backdrop-filter:blur(5px)}h1{margin:0 0 6px;text-align:center;color:#3a1d0f}p{margin:0 0 20px;text-align:center;color:#6b5548}.brand{font-weight:800;font-size:26px;text-align:center;color:#3a1d0f}.sub{text-align:center;margin:4px 0 20px}input,select,button{width:100%;padding:13px;margin:8px 0;border-radius:12px;border:1px solid #d9c8b7;font-size:15px}button{background:#3a1d0f;color:white;border:0;font-weight:700;cursor:pointer}.note{font-size:12px;color:#806f63;text-align:center;margin-top:10px}
</style>
<div class="card">
  <div class="brand">🍳 Moti Kitchen</div>
  <div class="sub">Welcome to moti kitchen ❤️</div>
  <h1>Join Room</h1>
  <p>Anyone with this room link can join.</p>
  <form method="post" action="/join/{{room_id}}">
    <input name="username" placeholder="Username" required maxlength="50">
    <select name="category">{% for c in categories %}<option>{{c}}</option>{% endfor %}</select>
    <button>Enter Room</button>
  </form>
  <div class="note">The room stays open until someone presses Exit Room.</div>
</div>
